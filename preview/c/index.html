<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Набросок В — Метро</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--enamel:#0F1B3D;--enamel2:#16244F;--porcelain:#F5F3EE;--ink2:rgba(245,243,238,.72);
  --yt:#E5322D;--ig:#C13584;--tg:#2AABEE;--ai:#2FB67C;--cobalt:#3B5BFF;--cobalt-deep:#2A44D6;--sans:"Golos Text",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--enamel);color:var(--porcelain);font:500 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--porcelain);color:var(--enamel)}
:focus-visible{outline:3px solid var(--porcelain);outline-offset:3px;border-radius:6px}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:14px 16px}
.site{display:inline-flex;align-items:center;gap:8px;font:800 17px/1 var(--sans);letter-spacing:-.02em}
.site svg{width:24px;height:24px}
.enter{font:600 15px/1 var(--sans);color:var(--porcelain);text-decoration:none;padding:9px 16px;border-radius:999px;border:1.5px solid rgba(245,243,238,.5)}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* табличка «следующая станция», как над дверью вагона */
.sign{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.sign .m{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yt);display:grid;place-items:center;font:900 18px/1 var(--sans);color:#fff}
.sign span{font:600 15px/1.2 var(--sans);color:var(--ink2)}
h1{font:900 clamp(44px,12.6vw,78px)/.95 var(--sans);letter-spacing:-.045em;margin:4px 0 0}
h1 .st{display:block;color:var(--porcelain)}

/* схема: одна линия от телефона до пересадки, дальше четыре ветки */
.map{position:relative;margin:26px 0 0;height:300px}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{position:absolute;font:700 15px/1.15 var(--sans);white-space:nowrap}
.lbl small{display:block;font:500 12.5px/1.2 var(--sans);color:var(--ink2)}
.pal{position:absolute;left:0;top:96px;width:86px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.hub{position:absolute;left:100px;top:118px}
.hub b{display:block;font:800 18px/1.1 var(--sans)}
.hub small{color:var(--ink2);font:500 13px/1.3 var(--sans)}
.train{offset-rotate:0deg}
@media (prefers-reduced-motion:no-preference){
  .dash{stroke-dasharray:6 10;animation:run 1.2s linear infinite}
}
@keyframes run{to{stroke-dashoffset:-32}}

.cta{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;background:var(--porcelain);color:var(--enamel);text-decoration:none;font:800 18px/1.2 var(--sans);letter-spacing:-.01em;transition:transform .2s,background .2s}
.btn:hover{background:#fff}.btn:active{transform:scale(.985)}
.note{margin:0;font-size:15px;color:var(--ink2);text-align:center}
</style>
</head>
<body>
<header class="bar"><span class="site"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="12" fill="#fff" stroke="#3B5BFF" stroke-width="5"/><rect x="14" y="14" width="16" height="16" rx="4" fill="#BFD3FF"/><rect x="34" y="14" width="16" height="16" rx="4" fill="#BFD3FF"/><rect x="14" y="36" width="36" height="14" rx="4" fill="#3B5BFF"/></svg>Форточка</span><a class="enter" href="#">Войти</a></header>
<main>
<div class="sign"><span class="m" aria-hidden="true">Ф</span><span>Следующая станция</span></div>
<h1><span class="st" id="next">YouTube</span></h1>
<div class="map" role="img" aria-label="Схема: ваш телефон, пересадка на Форточку, дальше YouTube, Instagram, Telegram и ChatGPT">
<svg class="lines" viewBox="0 0 360 300" preserveAspectRatio="none" aria-hidden="true">
<!-- линия от телефона к пересадке -->
<path d="M43 0 V96" stroke="#F5F3EE" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<path class="dash" d="M43 0 V96" stroke="#0F1B3D" stroke-width="2.5" stroke-linecap="round"/>
<!-- четыре ветки от пересадки -->
<path d="M86 139 H170 L210 99 H360" stroke="var(--yt)" stroke-width="8" fill="none" stroke-linejoin="round"/>
<path d="M86 139 H360" stroke="var(--ig)" stroke-width="8" fill="none"/>
<path d="M86 139 H170 L210 179 H360" stroke="var(--tg)" stroke-width="8" fill="none" stroke-linejoin="round"/>
<path d="M43 182 V250 L73 280 H360" stroke="var(--ai)" stroke-width="8" fill="none" stroke-linejoin="round"/>
<g fill="#F5F3EE" stroke="#0F1B3D" stroke-width="3"><circle cx="300" cy="99" r="9"/><circle cx="300" cy="139" r="9"/><circle cx="300" cy="179" r="9"/><circle cx="300" cy="280" r="9"/></g>
</svg>
<span class="lbl" style="left:54px;top:4px">Ваш телефон<small>без Форточки дальше не едет</small></span>
<svg class="pal" viewBox="0 0 120 120" aria-hidden="true">
<defs><linearGradient id="g-frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E4E9F7"/></linearGradient><linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE8FF"/><stop offset="1" stop-color="#A9C2FF"/></linearGradient></defs>
<rect x="8" y="8" width="104" height="104" rx="22" fill="url(#g-frame)" stroke="#3B5BFF" stroke-width="5"/>
<rect x="20" y="20" width="36" height="38" rx="9" fill="url(#g-glass)"/><circle cx="38" cy="40" r="11" fill="#fff"/><circle cx="42" cy="40" r="5.5" fill="#111214"/>
<rect x="64" y="20" width="36" height="38" rx="9" fill="url(#g-glass)"/><circle cx="82" cy="40" r="11" fill="#fff"/><circle cx="86" cy="40" r="5.5" fill="#111214"/>
<rect x="20" y="66" width="80" height="34" rx="9" fill="url(#g-glass)" stroke="#fff" stroke-width="3"/>
</svg>
<span class="lbl" style="right:0;top:72px;text-align:right">YouTube</span>
<span class="lbl" style="right:0;top:112px;text-align:right">Instagram*</span>
<span class="lbl" style="right:0;top:190px;text-align:right">Telegram</span>
<span class="lbl" style="right:0;top:252px;text-align:right">ChatGPT</span>
</div>
<div class="cta">
<a class="btn" href="#">Поехали: 3 дня бесплатно</a>
<p class="note">Пересадка на Форточку — 2 минуты. Потом 199&nbsp;₽ в&nbsp;месяц.</p>
</div>
</main>
<script>
(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const s=["YouTube","Instagram*","Telegram","ChatGPT"],el=document.getElementById("next"),m=document.querySelector(".sign .m"),c=["#E5322D","#C13584","#2AABEE","#2FB67C"];let i=0;
setInterval(()=>{i=(i+1)%s.length;el.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-14px)"}],{duration:220,easing:"ease-in"}).onfinish=()=>{el.textContent=s[i];m.style.background=c[i];el.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:380,easing:"cubic-bezier(.16,1,.3,1)"})}},2600)})();
</script>
</body>
</html>
