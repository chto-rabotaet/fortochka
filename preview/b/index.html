<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Набросок Б — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--wall:#E9ECEF;--tile:#DCE1E6;--ink:#141517;--ink2:#565B63;--panel:#17181B;--flap:#26282D;--flap2:#1F2125;--letter:#F3F1EA;
  --red:#FF5A4F;--green:#38D27A;--cobalt:#3B5BFF;--cobalt-deep:#2A44D6;--sans:"Golos Text",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:var(--ink);font:500 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:linear-gradient(var(--tile) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,var(--tile) 1px,transparent 1px) 0 0/88px 100%,var(--wall)}
::selection{background:var(--cobalt);color:#fff}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:6px}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:14px 16px}
.site{display:inline-flex;align-items:center;gap:8px;font:800 17px/1 var(--sans);letter-spacing:-.02em}
.site svg{width:24px;height:24px}
.enter{font:600 15px/1 var(--sans);color:var(--ink);text-decoration:none;padding:10px 16px;border-radius:999px;background:#fff}
main{max-width:560px;margin:0 auto;padding:4px 16px 40px}
h1{font:900 clamp(40px,11.5vw,72px)/.98 var(--sans);letter-spacing:-.045em;margin:10px 0 64px;text-wrap:balance}

/* табло: панель, перекидные ячейки */
.board{position:relative;background:var(--panel);border-radius:18px;padding:52px 14px 14px;box-shadow:0 2px 0 #000,0 22px 40px rgba(20,21,23,.28)}
.pal{position:absolute;top:-46px;left:50%;width:84px;translate:-50% 0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.pal .pupil{transition:transform .4s cubic-bezier(.16,1,.3,1)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0D0E10;border-radius:12px;padding:4px;margin:0 0 12px}
.switch button{font:700 15px/1 var(--sans);color:#9EA3AB;background:transparent;border:0;border-radius:9px;min-height:44px;cursor:pointer;transition:background .2s,color .2s}
.switch button[aria-pressed=true]{background:#2F3238;color:#fff}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rows li{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:9px}
.name{display:block;color:#C9CCD1;font:600 13px/1 var(--sans);margin:0 0 5px}
.flaps{display:flex;gap:2px}
.flaps i{position:relative;flex:1;max-width:22px;height:30px;display:grid;place-items:center;font:800 17px/1 var(--sans);font-style:normal;color:var(--letter);
  background:linear-gradient(var(--flap) 50%,var(--flap2) 50%);border-radius:3px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.04)}
.flaps i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0B0C0D}
.flaps.bad i{color:var(--red)}.flaps.ok i{color:var(--green)}
.flaps i.flip{animation:flip .26s cubic-bezier(.5,0,.5,1)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.foot{display:flex;justify-content:space-between;color:#8C9198;font-size:12.5px;margin:12px 2px 0}

.cta{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;background:var(--cobalt);color:#fff;text-decoration:none;font:700 18px/1.2 var(--sans);letter-spacing:-.01em;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 10px 24px rgba(20,21,23,.18);transition:background .2s,transform .2s}
.btn:hover{background:var(--cobalt-deep)}.btn:active{transform:scale(.985)}
.note{margin:0;font-size:15px;color:var(--ink2);text-align:center}
@media (prefers-reduced-motion:reduce){.flaps i.flip{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-yt" viewBox="0 0 36 36"><rect width="36" height="36" rx="11" fill="#FF3B30"/><path d="M14.5 12.5v11l9-5.5z" fill="#fff"/></symbol>
<symbol id="i-ig" viewBox="0 0 36 36"><defs><linearGradient id="g-ig" x1="0" y1="36" x2="36" y2="0"><stop offset="0" stop-color="#FFB13B"/><stop offset=".5" stop-color="#F0386B"/><stop offset="1" stop-color="#8A3BFF"/></linearGradient></defs><rect width="36" height="36" rx="11" fill="url(#g-ig)"/><rect x="10" y="10" width="16" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="18" cy="18" r="3.8" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="22.6" cy="13.4" r="1.2" fill="#fff"/></symbol>
<symbol id="i-tg" viewBox="0 0 36 36"><rect width="36" height="36" rx="11" fill="#2AABEE"/><path d="M26.4 10.6 8.9 17.4c-.9.4-.9 1.6 0 1.9l4.2 1.4 1.6 5c.3.8 1.3 1 1.8.4l2.4-2.4 4.3 3.2c.7.5 1.7.1 1.9-.7l2.7-14c.2-1-.7-1.8-1.6-1.4Zm-10.9 10 7.4-6.6-6 7.8-.2 2.8-1.2-4Z" fill="#fff"/></symbol>
<symbol id="i-ai" viewBox="0 0 36 36"><rect width="36" height="36" rx="11" fill="#3A3D44"/><path d="M18 9.5c1.2 4.6 3.9 7.3 8.5 8.5-4.6 1.2-7.3 3.9-8.5 8.5-1.2-4.6-3.9-7.3-8.5-8.5 4.6-1.2 7.3-3.9 8.5-8.5Z" fill="#fff"/></symbol>
</svg>
<header class="bar"><span class="site"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="12" fill="#fff" stroke="#3B5BFF" stroke-width="5"/><rect x="14" y="14" width="16" height="16" rx="4" fill="#BFD3FF"/><rect x="34" y="14" width="16" height="16" rx="4" fill="#BFD3FF"/><rect x="14" y="36" width="36" height="14" rx="4" fill="#3B5BFF"/></svg>Форточка</span><a class="enter" href="#">Войти</a></header>
<main>
<h1>Интернет как&nbsp;раньше</h1>
<section class="board" aria-label="Табло: что открывается сегодня">
<svg class="pal" viewBox="0 0 120 120" aria-hidden="true">
<defs><linearGradient id="g-frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E4E9F7"/></linearGradient><linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE8FF"/><stop offset="1" stop-color="#A9C2FF"/></linearGradient></defs>
<rect x="8" y="8" width="104" height="104" rx="22" fill="url(#g-frame)" stroke="#3B5BFF" stroke-width="5"/>
<rect x="20" y="20" width="36" height="38" rx="9" fill="url(#g-glass)"/><circle cx="38" cy="40" r="11" fill="#fff"/><g class="pupil"><circle cx="38" cy="43" r="5.5" fill="#111214"/></g>
<rect x="64" y="20" width="36" height="38" rx="9" fill="url(#g-glass)"/><circle cx="82" cy="40" r="11" fill="#fff"/><g class="pupil"><circle cx="82" cy="43" r="5.5" fill="#111214"/></g>
<rect x="20" y="66" width="80" height="34" rx="9" fill="url(#g-glass)" stroke="#fff" stroke-width="3"/>
</svg>
<div class="switch" role="group" aria-label="Показать">
<button type="button" data-mode="off" aria-pressed="false">Без Форточки</button><button type="button" data-mode="on" aria-pressed="true">С Форточкой</button>
</div>
<ul class="rows">
<li><svg class="ico"><use href="#i-yt"/></svg><div><span class="name">YouTube</span><div class="flaps" data-svc></div></div></li>
<li><svg class="ico"><use href="#i-ig"/></svg><div><span class="name">Instagram*</span><div class="flaps" data-svc></div></div></li>
<li><svg class="ico"><use href="#i-tg"/></svg><div><span class="name">Telegram</span><div class="flaps" data-svc></div></div></li>
<li><svg class="ico"><use href="#i-ai"/></svg><div><span class="name">ChatGPT</span><div class="flaps" data-svc></div></div></li>
</ul>
<p class="foot"><span>Проверка с телефона, Петербург</span><span>сегодня 15:00</span></p>
</section>
<div class="cta">
<a class="btn" href="#">Попробовать 3 дня бесплатно</a>
<p class="note">Карта не нужна. Потом 199 ₽ в месяц.</p>
</div>
</main>
<script>
(()=>{
const W=11,word={on:"ОТКРЫВАЕТСЯ",off:"ЗАКРЫТ"},still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const boxes=[...document.querySelectorAll("[data-svc]")];
boxes.forEach(b=>{for(let i=0;i<W;i++)b.append(document.createElement("i"))});
const pupils=document.querySelectorAll(".pal .pupil");
const set=(mode,anim)=>{
  document.querySelectorAll(".switch button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.mode===mode)));
  pupils.forEach(p=>p.style.transform=mode==="on"?"translateY(-4px)":"translateY(2px)");
  const t=word[mode].padEnd(W," ");
  boxes.forEach((b,r)=>{b.className="flaps "+(mode==="on"?"ok":"bad");[...b.children].forEach((c,i)=>{
    const go=()=>{c.textContent=t[i];if(anim&&!still){c.classList.remove("flip");void c.offsetWidth;c.classList.add("flip")}};
    anim&&!still?setTimeout(go,r*90+i*35):go()})})};
document.querySelectorAll(".switch button").forEach(x=>x.onclick=()=>set(x.dataset.mode,true));
set("off",false);setTimeout(()=>set("on",true),900);  // сначала правда без нас, потом с нами
})();
</script>
</body>
</html>
